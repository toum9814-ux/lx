<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图片与文字管理</title>

<style>
body{font-family:Arial;background:#f6f6f6;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:15px}
.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1px solid #eee;padding:6px;border-radius:8px}
.item img{width:100%;border-radius:6px}
.btn{display:inline-block;padding:6px 10px;background:#1677ff;color:#fff;border-radius:6px;text-decoration:none;margin:4px 0;border:0;cursor:pointer}
.del{background:#ff4d4f}
textarea{width:100%;height:120px}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h3>批量上传图片（本地保存）</h3>
<input type="file" id="file" multiple accept="image/*"><br><br>
<button class="btn" onclick="upload()">上传</button>
</div>

<div class="card">
<h3>图片管理</h3>
<div class="grid" id="list"></div>
</div>

<div class="card">
<h3>文字内容</h3>
<textarea id="txt"></textarea><br>
<button class="btn" onclick="saveText()">保存文字</button>
</div>

</div>

<script>
// 读取
function load(){
  let imgs = JSON.parse(localStorage.getItem('imgs')||'[]')
  let html = ''
  imgs.forEach((it,i)=>{
    html += `
    <div class="item">
      <a href="${it}" download="image_${i}.png">
        <img src="${it}">
      </a>
      <button class="btn del" onclick="del(${i})">删除</button>
    </div>`
  })
  document.getElementById('list').innerHTML = html

  document.getElementById('txt').value =
      localStorage.getItem('text')||''
}

// 上传
function upload(){
  let f = document.getElementById('file').files
  let imgs = JSON.parse(localStorage.getItem('imgs')||'[]')

  Array.from(f).forEach(file=>{
    let r = new FileReader()
    r.onload = e=>{
      imgs.push(e.target.result)
      localStorage.setItem('imgs',JSON.stringify(imgs))
      load()
    }
    r.readAsDataURL(file)
  })
}

// 删除
function del(i){
  if(!confirm('确定删除？')) return
  let imgs = JSON.parse(localStorage.getItem('imgs')||'[]')
  imgs.splice(i,1)
  localStorage.setItem('imgs',JSON.stringify(imgs))
  load()
}

// 保存文字
function saveText(){
  localStorage.setItem('text',
    document.getElementById('txt').value)
  alert('已保存')
}

load()
</script>

</body>
</html>
