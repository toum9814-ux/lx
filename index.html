<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>个人图床</title>

<style>
body{background:#f5f6fa;font-family:Arial;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:15px}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{border:1px solid #eee;padding:6px;border-radius:8px}
.item img{width:100%;border-radius:6px}
.btn{background:#1677ff;color:#fff;padding:6px 10px;border:0;border-radius:6px;cursor:pointer;margin:3px}
.del{background:#ff4d4f}
textarea{width:100%;padding:8px}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h3>批量上传图片</h3>
<input type="file" id="file" multiple accept="image/*"><br><br>
<button class="btn" onclick="upload()">上传</button>
</div>

<div class="card">
<h3>图片管理</h3>
<div class="grid" id="list"></div>
</div>

<div class="card">
<h3>文字内容</h3>
<textarea id="txt" rows="6"></textarea><br>
<button class="btn" onclick="saveText()">保存文字</button>
</div>

</div>

<script>
// ===== 这里改成你的 =====
const CONFIG = {
  token: "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",
  user: "lx",
  repo: "toum9814-ux"
}
// ======================

function toBase64(f){
 return new Promise(r=>{
  let rd=new FileReader()
  rd.onload=e=>r(e.target.result)
  rd.readAsDataURL(f)
 })
}

// 上传
async function upload(){
 let fs=file.files

 for(let f of fs){
  let b64=await toBase64(f)
  let path="img/"+Date.now()+"_"+f.name

  await fetch(
   `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${path}`,
   {
    method:"PUT",
    headers:{
     "Authorization":"token "+CONFIG.token,
     "Content-Type":"application/json"
    },
    body:JSON.stringify({
     message:"upload",
     content:b64.split(",")[1]
    })
   }
  )
 }

 alert("上传完成")
 loadImg()
}

// 读取
async function loadImg(){

 let r=await fetch(
  `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/img`
 )

 let ls=await r.json()
 if(!Array.isArray(ls)) return

 let h=""
 ls.forEach(it=>{

  let url=
`https://cdn.jsdelivr.net/gh/${CONFIG.user}/${CONFIG.repo}@main/${it.path}`

  h+=`
  <div class="item">
   <img src="${url}">
   <input value="${url}">

   <button class="btn" onclick="copy(this)">复制</button>
   <a class="btn" href="${url}" download>下载</a>

   <button class="btn del"
   onclick="del('${it.path}','${it.sha}')">
   删除</button>
  </div>`
 })

 list.innerHTML=h
}

function copy(b){
 let i=b.parentNode.querySelector("input")
 i.select()
 document.execCommand("copy")
 alert("已复制")
}

// 删除
async function del(p,sha){
 if(!confirm("确定删除？"))return

 await fetch(
 `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${p}`,
 {
  method:"DELETE",
  headers:{
   "Authorization":"token "+CONFIG.token,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   message:"del",
   sha:sha
  })
 })

 loadImg()
}

// 文字
async function saveText(){

 let content=btoa(unescape(encodeURIComponent(txt.value)))

 let sha=""
 try{
  let r=await fetch(
   `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/text.txt`
  )
  let j=await r.json()
  sha=j.sha
 }catch(e){}

 await fetch(
 `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/text.txt`,
 {
  method:"PUT",
  headers:{
   "Authorization":"token "+CONFIG.token,
   "Content-Type":"application/json"
  },
  body:JSON.stringify({
   message:"text",
   content:content,
   sha:sha
  })
 })

 alert("已保存")
}

loadImg()
</script>
</body>
</html>
